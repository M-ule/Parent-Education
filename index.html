<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f766e" />
  <title>2026 진로진학 설명회 학부모 교육자료</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", "Malgun Gothic", sans-serif;
      background: #f4f7f6;
      color: #1f2937;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: min(720px, 100%);
      background: #fff;
      border: 1px solid #dfe7e4;
      border-radius: 20px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 12px 35px rgba(15, 118, 110, 0.08);
    }
    .badge {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 999px;
      background: #e8f5f2;
      color: #0f766e;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(26px, 5vw, 38px);
      line-height: 1.3;
      letter-spacing: -0.04em;
    }
    .desc {
      margin: 0 auto 26px;
      color: #5b6470;
      font-size: 16px;
      line-height: 1.65;
    }
    .actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 50px;
      padding: 0 22px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 800;
      font-size: 16px;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .primary {
      background: #0f766e;
      color: #fff;
      box-shadow: 0 8px 18px rgba(15, 118, 110, .18);
    }
    .secondary {
      background: #fff;
      color: #0f766e;
      border: 1px solid #9fd4ca;
    }
    .qr-wrap {
      margin: 0 auto;
      width: min(360px, 86vw);
      padding: 18px;
      background: #fff;
      border: 1px solid #d8e4e1;
      border-radius: 18px;
    }
    .qr-wrap img {
      width: 100%;
      height: auto;
      display: block;
    }
    .qr-title {
      margin: 18px 0 5px;
      font-weight: 800;
      color: #0f766e;
    }
    .qr-note {
      margin: 0;
      color: #6b7280;
      font-size: 14px;
      line-height: 1.6;
    }
    footer {
      margin-top: 26px;
      color: #9aa3ad;
      font-size: 12px;
      word-break: break-all;
    }
    @media (max-width: 520px) {
      body { padding: 14px; }
      .card { padding: 28px 18px; border-radius: 16px; }
      .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">2026학년도</div>
    <h1>진로진학 설명회<br>학부모 교육자료</h1>
    <p class="desc">
      아래 버튼을 누르면 교육자료 PDF를 바로 열 수 있습니다.<br>
      PC에서 보고 계신 경우 QR코드를 휴대전화로 촬영해도 됩니다.
    </p>

    <div class="actions">
      <a class="btn primary" href="./2026-parent-education.pdf" target="_blank" rel="noopener">PDF 바로 열기</a>
      <a class="btn secondary" href="./2026-parent-education.pdf" download>PDF 저장하기</a>
    </div>

    <section class="qr-wrap" aria-label="학부모 교육자료 QR코드">
      <img src="./parent-education-qr.png" alt="2026 진로진학 설명회 학부모 교육자료 PDF QR코드" />
    </section>
    <p class="qr-title">QR코드로 자료 열기</p>
    <p class="qr-note">QR코드를 스캔하면 교육자료 PDF가 바로 열립니다.</p>

    <footer>https://m-ule.github.io/Parent-Education-2026/2026-parent-education.pdf</footer>
  </main>
</body>
</html>

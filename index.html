<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="description" content="2026학년도 진로진학 설명회 학부모 교육자료 안내 페이지" />
  <title>2026 진로진학 설명회 학부모 교육자료</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", "Malgun Gothic", sans-serif;
      background: #f4f7f6;
      color: #1f2937;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: min(720px, 100%);
      background: #fff;
      border: 1px solid #dfe7e4;
      border-radius: 20px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 12px 35px rgba(15, 118, 110, 0.08);
    }
    .badge {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 999px;
      background: #e8f5f2;
      color: #0f766e;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 14px;
    }
    h1 {
      margin: 0 0 16px;
      font-size: clamp(26px, 5vw, 38px);
      line-height: 1.3;
      letter-spacing: -0.04em;
    }
    .info {
      margin: 0 auto 10px;
      color: #374151;
      font-size: 16px;
      line-height: 1.7;
      font-weight: 600;
    }
    .desc {
      margin: 0 auto 30px;
      max-width: 560px;
      color: #5b6470;
      font-size: 16px;
      line-height: 1.75;
    }
    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 0 24px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 800;
      font-size: 16px;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .primary {
      background: #0f766e;
      color: #fff;
      box-shadow: 0 8px 18px rgba(15, 118, 110, .18);
    }
    .secondary {
      background: #fff;
      color: #0f766e;
      border: 1px solid #9fd4ca;
    }
    .notice {
      margin: 28px auto 0;
      padding-top: 22px;
      border-top: 1px solid #e5e7eb;
      max-width: 560px;
      color: #6b7280;
      font-size: 14px;
      line-height: 1.7;
    }
    @media (max-width: 520px) {
      body { padding: 14px; }
      .card { padding: 30px 18px; border-radius: 16px; }
      .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">2026학년도</div>
    <h1>진로진학 설명회<br>학부모 교육자료</h1>

    <p class="info">2026. 9. 28.(월) 18:30</p>
    <p class="desc">
      장흥중학교 진로진학 설명회 학부모 교육자료입니다.<br>
      아래 버튼을 선택하시면 교육자료를 확인하실 수 있습니다.
    </p>

    <div class="actions">
      <a class="btn primary" href="./2026-parent-education.pdf" target="_blank" rel="noopener">교육자료 PDF 열기</a>
      <a class="btn secondary" href="./2026-parent-education.pdf" download>교육자료 PDF 내려받기</a>
    </div>

    <p class="notice">
      휴대전화에서는 PDF 열기 버튼을 이용하시면 바로 확인하실 수 있습니다.<br>
      파일이 열리지 않는 경우 PDF를 내려받아 확인해 주시기 바랍니다.
    </p>
  </main>
</body>
</html>
